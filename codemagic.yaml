# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — My Digital Handbags iOS build
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  ios-app-store:
    name: iOS Release – My Digital Handbags
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: codemagic  # set up in Codemagic dashboard → Integrations

    environment:
      xcode: latest
      node: "22"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mydigitalhandbags.app
      vars:
        BUNDLE_ID: com.mydigitalhandbags.app
        XCODE_PROJECT: artifacts/outfit-generator/ios/App/App.xcodeproj
        XCODE_SCHEME: App
        COREPACK_ENABLE_STRICT: "0"
        COREPACK_DEFAULT_TO_LATEST: "0"

    scripts:
      - name: Install dependencies
        script: |
          corepack disable || true
          npm install -g pnpm@9 --force
          pnpm install --no-frozen-lockfile

      - name: Build web + sync Capacitor
        script: |
          pnpm --filter @workspace/outfit-generator run build:ios

      - name: Add export compliance to Info.plist
        script: |
          PLIST="artifacts/outfit-generator/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"

      - name: Inject app icon
        script: |
          ICONSET="artifacts/outfit-generator/ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          sips -z 1024 1024 app-store/AppIcon-1024.png --out "$ICONSET/AppIcon-1024.png"
          cat > "$ICONSET/Contents.json" << 'EOF'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd artifacts/outfit-generator/ios/App
          agvtool new-version -all $(date +%s)

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false  # flip to true when ready for full App Review
